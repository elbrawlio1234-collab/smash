<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nintendo 64 - Web Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        EJS_player = '#game';
        EJS_core = 'n64';
        EJS_gameName = 'Nintendo 64 Game';
        EJS_gameUrl = 'https://tu-usuario.github.io/nombre-del-repositorio/sm.z64';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_language = 'es-ES';
        EJS_startOnLoaded = true;
        EJS_defaultOptions = {
            useTouch: true,
            shader: 'disabled'
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
